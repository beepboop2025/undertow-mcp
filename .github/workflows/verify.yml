name: verify MCP listing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

concurrency:
  group: undertow-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Undertow core revision
        id: core-pin
        run: |
          sha="$(python3 scripts/verify_core_pin.py --print-pin)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the exact Undertow core revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: beepboop2025/liquilens-undertow
          ref: ${{ steps.core-pin.outputs.sha }}
          path: .core/liquilens-undertow
          persist-credentials: false

      - name: Verify listing and pinned-core contracts
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/verify_core_pin.py --core .core/liquilens-undertow

  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke initialize, discovery, catalogs, and one read-only tool
        run: python3 scripts/smoke_live_mcp.py
