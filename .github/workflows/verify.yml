name: verify MCP listing

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

concurrency:
  group: undertow-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Python environment manager
        run: python3 -m pip install uv==0.10.0

      - name: Verify listing and reviewed source receipt
        run: |
          uv run --locked python -m unittest discover -s tests -v
          uv run --locked python scripts/smoke_stdio.py --offline
          python3 scripts/verify_core_pin.py --receipt

      - name: Build the public stdio adapter
        run: docker build --tag undertow-mcp:verify .

  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke initialize, discovery, catalogs, and one read-only tool
        run: python3 scripts/smoke_live_mcp.py
